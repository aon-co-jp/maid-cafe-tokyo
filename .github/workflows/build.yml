name: Build both servers (and release on tag)
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["english/**", "realdata/**", "deps.lock", "scripts/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install glslc (Vulkan shaders compiled at build time)
        run: sudo apt-get update && sudo apt-get install -y glslc
      - name: Build both servers with the pinned sibling repositories
        # build.sh は deps.lock の兄弟リポジトリを、このリポジトリの隣へ取得してビルドする。
        run: bash scripts/build.sh
        env:
          W: ${{ github.workspace }}/..
      - uses: actions/upload-artifact@v4
        with:
          name: maid-cafe-tokyo-linux-x86_64
          path: |
            dist/maid-cafe-tokyo-linux-x86_64.tar.gz
            dist/SHA256SUMS
      - name: Attach to the release (tag push only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/maid-cafe-tokyo-linux-x86_64.tar.gz
            dist/SHA256SUMS
